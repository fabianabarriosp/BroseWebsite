<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spinning 3D logo</title>
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
    ></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #b3150d;
      }
      .stage {
        display: grid;
        place-items: center;
      }
      model-viewer {
        width: min(80vw, 520px);
        height: min(80vw, 520px);
        cursor: pointer;
      }
      .shadow {
        width: min(40vw, 260px);
        height: 24px;
        margin-top: -60px;
        border-radius: 50%;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0.35) 0%,
          rgba(0, 0, 0, 0) 70%
        );
        animation: coin 6s ease-in-out infinite;
      }
      /* shadow gets narrow when the coin is sideways, wide when it faces you */
      @keyframes coin {
        0%,
        100% {
          transform: scaleX(1);
        }
        50% {
          transform: scaleX(0.25);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .shadow {
          animation: none;
        }
      }
      .sound-hint {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        color: #ffffff;
        opacity: 0.6;
        letter-spacing: 1px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <model-viewer
        id="logo"
        src="Fall.glb"
        animation-name="Fall"
        alt="Spinning 3D logo"
        auto-rotate
        auto-rotate-delay="0"
        rotation-per-second="30deg"
        interaction-prompt="none"
        camera-orbit="0deg 85deg auto"
        environment-image="neutral"
        shadow-intensity="0"
      >
      </model-viewer>
      <p class="sound-hint">🔊 Sound on, then click the logo</p>
      <div class="shadow"></div>
    </div>

    <script>
      const logo = document.querySelector("#logo");

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        logo.removeAttribute("auto-rotate");
      }

      /* the sword falls when you click the logo */
      const clank = new Audio("clank.mp3");
      const clink = new Audio("clank.mp3");
      clink.volume = 0.4;

      const landingTime = 1.6; // seconds until the sword hits the ground
      const bounceTime = 2.0; // seconds until the small bounce
      let hasFallen = false;

      // unlocks a sound during the click, so the browser allows it later
      function unlock(sound) {
        sound.muted = true;
        sound.play().then(() => {
          sound.pause();
          sound.currentTime = 0;
          sound.muted = false;
        });
      }

      logo.addEventListener("click", () => {
        if (hasFallen) return; // the sword can only fall once
        hasFallen = true;

        unlock(clank);
        unlock(clink);

        logo.play({ repetitions: 1 }); // play the Blender animation once

        setTimeout(() => {
          clank.play(); // loud clank when it hits the ground
        }, landingTime * 1000);

        setTimeout(() => {
          clink.play(); // quieter clink when it bounces
        }, bounceTime * 1000);
      });
    </script>
  </body>
</html>
